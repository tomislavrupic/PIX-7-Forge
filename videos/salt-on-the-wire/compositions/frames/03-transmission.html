        .g1-chrome::before,

        .g1-route {

          top: -3px;

        .g1-packet {

          border: 1px solid #e85d26;

          opacity: 0;
        }

        .g1-packet::before,
        .g1-packet::after {
          content: "";
          position: absolute;
          inset: 12%;
          border: 1px solid rgba(232, 93, 38, 0.72);

        .g1-packet-copy {

        .g1-broadcast {

          grid-template-rows: 10cqh 1fr 9cqh;

          opacity: 0;

        .g1-broadcast header b {

        .g1-broadcast main {

        .g1-broadcast footer {

        .g1-bars {

        .g1-trails {
          position: absolute;
          inset: 0;
          opacity: 0;
        }

        .g1-trails i {
          position: absolute;
          left: 8%;
          width: var(--w);
          top: var(--y);
          height: 3px;
          background: #e85d26;

          opacity: 0.55;
        }

          position: absolute;
          inset: 0;
          background: #e85d26;

      <script>
        window.__timelines = window.__timelines || {};

        const g1ParticleField = document.getElementById("g1-transmission-particles");
        for (let i = 0; i < 72; i += 1) {
          const particle = document.createElement("i");
          const angle = (i / 72) * Math.PI * 2;
          const radius = 31 + ((i * 29) % 29);
          particle.style.setProperty("--x", `${50 + Math.cos(angle) * radius}%`);
          particle.style.setProperty("--y", `${53 + Math.sin(angle) * radius * 0.56}%`);
          particle.style.setProperty("--s", `${2 + (i % 3)}px`);
          g1ParticleField.appendChild(particle);
        }

        const tl = gsap.timeline({ paused: true });
        const g1Anchors = [
          0, 3.948, 7.872, 11.75, 15.674, 19.598, 23.522, 27.446, 31.347,
          35.271, 39.172, 43.073, 46.974, 50.898, 54.799, 58.724, 62.625, 66.549, 68.499
        ];
        const g1Particles = "#g1-transmission-particles i";

        tl.set("#g1-transmission-field", { autoAlpha: 1 }, 0);
        tl.fromTo(".g1-grid", { opacity: 0.08 }, { opacity: 0.28, duration: 7.872, ease: "none" }, 0);
        tl.fromTo(".g1-chrome", { opacity: 0.25 }, { opacity: 0.92, duration: 3.948, ease: "power2.out" }, 0);
        tl.fromTo(".g1-route i", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 0.72, duration: 1.2, stagger: 0.11, ease: "power2.out" }, 3.948);

        g1Anchors.forEach((anchor, index) => {
          const pulse = ["#g1-transmission-pulse-a", "#g1-transmission-pulse-b", "#g1-transmission-pulse-c"][index % 3];
          tl.fromTo(pulse,
            { scale: 0.34, opacity: 0.85 },
            { scale: 2.7, opacity: 0, duration: 1.24, ease: "power2.out" },
            anchor
          );
          tl.fromTo(g1Particles,
            {
              x: (particleIndex) => `${Math.cos((particleIndex / 72) * Math.PI * 2) * (120 + (particleIndex % 7) * 13)}px`,
              y: (particleIndex) => `${Math.sin((particleIndex / 72) * Math.PI * 2) * (68 + (particleIndex % 5) * 9)}px`,
              opacity: 0.16,
              scale: 0.45
            },
            { x: 0, y: 0, opacity: 0.88, scale: 1.2, duration: 0.72, stagger: 0.002, ease: "power3.in" },
            anchor
          );
          tl.to(g1Particles, { opacity: 0.16, scale: 0.65, duration: 0.42, ease: "power2.out" }, anchor + 0.74);
        });

        [7.872, 19.598, 31.347, 43.073, 54.799, 62.625].forEach((anchor) => {
          tl.fromTo("#g1-transmission-packet",
            { autoAlpha: 0, scale: 0.58, rotate: -8 },
            { autoAlpha: 0.94, scale: 1, rotate: 0, duration: 0.46, ease: "back.out(1.8)" },
            anchor
          );
          tl.to("#g1-transmission-packet", { autoAlpha: 0, scale: 1.13, duration: 0.48, ease: "power2.in" }, anchor + 1.16);
        });

        [15.674, 27.446, 46.974, 58.724, 66.549].forEach((anchor, index) => {
          tl.fromTo("#g1-transmission-trails",
            { autoAlpha: 0, x: index % 2 === 0 ? -90 : 90 },
            { autoAlpha: 0.9, x: 0, duration: 0.2, ease: "power3.out" },
            anchor
          );
          tl.to("#g1-transmission-trails", { autoAlpha: 0, x: index % 2 === 0 ? 140 : -140, duration: 0.5, ease: "power2.in" }, anchor + 0.5);
        });

        tl.fromTo("#g1-transmission-broadcast",
          { autoAlpha: 0, scale: 0.985 },
          { autoAlpha: 1, scale: 1, duration: 0.12, ease: "none" },
          23.522
        );
        tl.fromTo(".g1-broadcast main strong", { x: -36 }, { x: 0, duration: 0.7, ease: "power3.out" }, 23.522);
        tl.fromTo(".g1-bars i", { scaleY: 0.15, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.42, stagger: 0.025, ease: "power2.out" }, 23.66);
        tl.to("#g1-transmission-broadcast", { autoAlpha: 0, duration: 0.08, ease: "none" }, 27.19);

        [35.271, 50.898, 68.499].forEach((anchor) => {
          tl.fromTo("#g1-transmission-flash", { opacity: 0.52 }, { opacity: 0, duration: 0.16, ease: "none" }, anchor);
        });

        tl.to(".g1-grid", { opacity: 0.42, duration: 8, ease: "none" }, 54.799);
        tl.set("#g1-transmission-field", { autoAlpha: 0 }, 68.987);
        tl.seek(0);
        window.__timelines["03-transmission"] = tl;
      </script>
